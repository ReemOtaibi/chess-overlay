<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; background:transparent; font-family:Arial,sans-serif; }
  #txt { font-size:64px; font-weight:bold; color:#ffd400; padding:10px 16px; display:inline-block;
         text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 8px #000; }
  .pos { color:#22e06b !important; }
  .neg { color:#ff4d4d !important; }
  .err { font-size:24px !important; color:#fff !important; }
</style>
</head>
<body>
<div id="txt">Loading...</div>
<script>
const USER = "ladymorphy";

// Your rating in each mode when you go live. Delete a line if you don't play that mode.
const BASES = {
  chess_rapid:  1800,
  chess_blitz:  1500,
  chess_bullet: 1300
};

async function update() {
  const el = document.getElementById("txt");
  try {
    const r = await fetch(`https://api.chess.com/pub/player/${USER}/stats`);
    if (!r.ok) throw new Error("Chess.com error " + r.status);
    const stats = await r.json();
    let diff = 0;
    for (const m in BASES) {
      if (stats[m] && stats[m].last) diff += stats[m].last.rating - BASES[m];
    }
    if (diff > 0)      { el.textContent = "Elo gained: +" + diff; el.className = "pos"; }
    else if (diff < 0) { el.textContent = "Elo lost: " + diff;    el.className = "neg"; }
    else               { el.textContent = "Elo: 0";               el.className = ""; }
  } catch(e) {
    el.textContent = "Error: " + e.message;
    el.className = "err";
  }
}
update(); setInterval(update, 20000);
</script>
</body>
</html>
